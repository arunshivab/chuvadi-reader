name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restore using the CI-only feed (ci/packages) + nuget.org. The dev tree's
      # ./localpackages is git-ignored and absent on the runner, so we point at
      # ci/nuget.config explicitly for every restore.
      - name: Restore (Core, Ui, Tests)
        run: |
          dotnet restore src/ChuvadiReader.Core/ChuvadiReader.Core.csproj --configfile ci/nuget.config
          dotnet restore src/ChuvadiReader.Ui/ChuvadiReader.Ui.csproj   --configfile ci/nuget.config
          dotnet restore tests/ChuvadiReader.Tests/ChuvadiReader.Tests.csproj --configfile ci/nuget.config

      - name: Build (Core, Ui, Tests)
        run: |
          dotnet build src/ChuvadiReader.Core/ChuvadiReader.Core.csproj -c Release --no-restore
          dotnet build src/ChuvadiReader.Ui/ChuvadiReader.Ui.csproj   -c Release --no-restore
          dotnet build tests/ChuvadiReader.Tests/ChuvadiReader.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/ChuvadiReader.Tests/ChuvadiReader.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      # The WPF host targets net10.0-windows and only builds on Windows.
      - name: Build WPF host (Windows only)
        if: runner.os == 'Windows'
        run: |
          dotnet restore src/ChuvadiReader.Windows/ChuvadiReader.Windows.csproj --configfile ci/nuget.config
          dotnet build src/ChuvadiReader.Windows/ChuvadiReader.Windows.csproj -c Release --no-restore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/test-results.trx'
          if-no-files-found: ignore
